
<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriBridge-AI | Mshauri wa Kilimo</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div style="padding: 10px; text-align: center;">
  <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key yako hapa" style="width: 85%; padding: 10px; border-radius: 8px; border: 1px solid #2e7d32; text-align: center;">
    </div>
        
        <div class="logo">
            <h1>🌱 AgriBridge-AI</h1>
        </div>
        <p>Mshauri wako wa Kilimo na Akili Bandia (Gemini AI)</p>
    </header>

    <main class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="message ai-message">
                <strong>AgriBridge AI:</strong> Habari! Mimi ni mshauri wako wa kilimo. Una swali gani kuhusu mazao, udongo, au masoko leo?
            </div>
        </div>

        <form id="agriForm" class="input-area">
            <input type="text" id="userInput" placeholder="Andika swali lako hapa kuhusu kilimo..." required>
            <button type="submit" id="sendBtn">Tuma</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 AgriBridge-AI. Haki zote zimehifadhiwa.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
