<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriBridge-AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🌱 AgriBridge-AI</div>
        <p>Mshauri wako wa Kilimo na Akili Bandia (Gemini AI)</p>
    </header>

    <div class="container">
        <!-- Kisanduku cha Wazi cha Kuingiza API Key -->
        <div style="padding: 10px; text-align: center; background-color: #f0fdf4; border-radius: 8px; margin-bottom: 15px; border: 1px solid #bbf7d0;">
            <label for="apiKeyInput" style="font-size: 13px; color: #166534; display: block; margin-bottom: 5px; font-weight: bold;">
                🔑 Weka Gemini API Key Yako Hapa Chini:
            </label>
            <input type="password" id="apiKeyInput" placeholder="Paste API Key hapa (AIzaSy...)" style="width: 90%; padding: 10px; border-radius: 6px; border: 1px solid #16a34a; text-align: center; font-size: 14px;">
        </div>

        <div id="chatBox" class="chat-box">
            <div class="message ai-message">
                <strong>AgriBridge AI:</strong> Habari! Mimi ni mshauri wako wa kilimo. Weka API Key yako hapo juu kwanza, kisha niulize swali lolote kuhusu mazao, udongo, au masoko!
            </div>
        </div>

        <form id="agriForm" class="input-area">
            <input type="text" id="userInput" placeholder="Andika swali lako hapa kuhusu kilimo..." required>
            <button type="submit">Tuma</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 AgriBridge-AI. Haki zote zimehifadhiwa.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
