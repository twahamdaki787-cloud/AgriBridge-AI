<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriBridge AI - Mshauri wa Kilimo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f0fdf4; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .chat-box { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        .input-form { display: flex; gap: 5px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #15803d; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h3>🌱 AgriBridge AI</h3>
    <input type="password" id="apiKey" placeholder="Weka Gemini API Key hapa" style="width: 100%; margin-bottom: 10px; padding: 10px;">
    <div class="chat-box" id="chatBox">Jambo! Weka Key yako na uulize swali la kilimo.</div>
    <form class="input-form" id="chatForm">
        <input type="text" id="userInput" placeholder="Uliza swali..." required>
        <button type="submit">Tuma</button>
    </form>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const apiKeyInput = document.getElementById('apiKey');

    // Load key
    apiKeyInput.value = localStorage.getItem('agri_gemini_key') || '';
    apiKeyInput.addEventListener('change', () => localStorage.setItem('agri_gemini_key', apiKeyInput.value.trim()));

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const query = userInput.value;
        const apiKey = apiKeyInput.value.trim();
        
        chatBox.innerHTML += `<div><b>Wewe:</b> ${query}</div>`;
        userInput.value = '';

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Wewe ni mtaalamu wa kilimo. Jibu swali hili kwa Kiswahili: " + query }] }]
                })
            });
            const data = await response.json();
            if (data.candidates) {
                chatBox.innerHTML += `<div><b>AI:</b> ${data.candidates[0].content.parts[0].text}</div>`;
            } else {
                chatBox.innerHTML += `<div><b>Kosa:</b> ${JSON.stringify(data.error.message)}</div>`;
            }
        } catch (err) {
            chatBox.innerHTML += `<div><b>Kosa:</b> Mtandao umefeli.</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    });
</script>
</body>
</html>
